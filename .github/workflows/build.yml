name: Build Tweak

on:
  workflow_dispatch: 
  push: 
    branches: [main, WeChatGroupExtractor]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          export THEOS=/Users/runner/theos
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf $THEOS
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      - name: Build roothide package
        run: |
          make package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGroupExtractor-roothide-deb
          path: packages/*.deb

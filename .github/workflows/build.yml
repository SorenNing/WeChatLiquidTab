name: Build Tweak

on:
  workflow_dispatch: 
  push: 
    branches: [main, WeChatGroupExtractor]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks
      
      - name: Install dependencies
        run: |
          brew install ldid
          ln -s /opt/theos /opt/homebrew/bin
      
      - name: Build package
        env:
          THEOS: /opt/theos
          SDKROOT: /opt/theos/sdks/iphoneos16.5.sdk
          SDK: iphoneos16.5
        run: |
          make package FINALPACKAGE=1
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGroupExtractor-deb
          path: packages/*.deb
